<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tutoring by Deni - Teorema Pythagoras</title>
    <!-- Tailwind CSS untuk styling tanpa scroll (100vh) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Mencegah scroll sama sekali */
            height: 100vh;
            width: 100vw;
            margin: 0;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mencegah scroll pada konten utama, gunakan flex untuk fit content */
        #main-content {
            flex-grow: 1;
            display: flex;
            overflow: hidden; 
        }
        .nav-btn.active {
            background-color: #16a34a;
            color: white;
            font-weight: bold;
        }
        .hidden-section { display: none !important; }
        .collapse-content {
            display: none;
        }
        .collapse-content.show {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="bg-green-700 text-white p-2 shadow-md flex justify-between items-center z-10">
        <div class="font-bold text-xl flex items-center gap-2">
            <i class="fa-solid fa-calculator"></i> MATH TUTORING <span class="text-sm font-normal">by Deni</span>
        </div>
        <div class="flex gap-1 overflow-hidden" id="top-nav">
            <!-- Dihasilkan melalui JS -->
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="w-full relative">
        <!-- Kontainer dinamis -->
        <div id="app-container" class="w-full h-full flex flex-col p-4">
            <!-- Konten dirender di sini -->
        </div>
    </main>

    <script>
// --- DATA GENERATOR UNTUK SOAL BERVARIASI ---
        // 1. Generator Spiral Review (Bangun Ruang & Akar/Kuadrat)
        const genSpiral = () => {
            let q = [];
            for(let i=1; i<=10; i++) {
                if(i <= 3) {
                    let s = Math.floor(Math.random() * 5) + 3;
                    q.push({ question: `Sebuah kubus memiliki panjang rusuk $${s}$ cm. Berapakah volumenya?`, options: [`${s*s*s}`, `${s*s}`, `${s*s*s + 2}`, `${s*s*s - 4}`], answer: `${s*s*s}`, explanation: `Volume kubus = $s \\times s \\times s = ${s} \\times ${s} \\times ${s} = ${s*s*s}$ cm$^3$.`});
                } else if(i <= 6) {
                    let p = Math.floor(Math.random() * 5) + 5, l = Math.floor(Math.random() * 4) + 2, t = Math.floor(Math.random() * 3) + 2;
                    q.push({ question: `Balok berukuran $${p} \\times ${l} \\times ${t}$ cm. Berapakah volumenya?`, options: [`${p*l*t}`, `${p*l*t + 5}`, `${p+l+t}`, `${p*l*t - 2}`], answer: `${p*l*t}`, explanation: `Volume balok = $p \\times l \\times t = ${p} \\times ${l} \\times ${t} = ${p*l*t}$ cm$^3$.`});
                } else if(i <= 8) {
                    let n = Math.floor(Math.random() * 10) + 4;
                    q.push({ question: `Berapakah nilai dari $${n}^2$?`, options: [`${n*n}`, `${n*2}`, `${n*n+1}`, `${n*n-1}`], answer: `${n*n}`, explanation: `$${n}^2 = ${n} \\times ${n} = ${n*n}$.`});
                } else {
                    let n = Math.floor(Math.random() * 10) + 5; let sq = n*n;
                    q.push({ question: `Berapakah akar kuadrat dari $\\sqrt{${sq}}$?`, options: [`${n}`, `${n+1}`, `${n-1}`, `${n*2}`], answer: `${n}`, explanation: `$\\sqrt{${sq}} = ${n}$ karena $${n} \\times ${n} = ${sq}$.`});
                }
            }
            return q.map(item => ({...item, options: item.options.sort(() => Math.random() - 0.5)}));
        };

        // 2. Generator Teorema Pythagoras (Bisa diatur mencari sisi c, a, atau b)
        const genPythagoras = (type, count, context = 'basic') => {
            const triplets = [[3,4,5], [6,8,10], [5,12,13], [9,12,15], [8,15,17], [12,16,20], [7,24,25], [15,20,25], [10,24,26], [18,24,30]];
            let q = [];
            for(let i=0; i<count; i++) {
                let trip = triplets[i % triplets.length];
                let [a, b, c] = trip;
                
                if(context === 'visual') {
                    q.push({
                        question: `Jika luas persegi pada sisi alas adalah $${a*a}$ cm$^2$ dan pada sisi tegak $${b*b}$ cm$^2$, berapakah panjang sisi miringnya?`,
                        options: [`${c}`, `${c+1}`, `${c-1}`, `${c*2}`], answer: `${c}`,
                        explanation: `Luas miring = luas alas + luas tegak. $c^2 = ${a*a} + ${b*b} = ${c*c}$. Maka $c = \\sqrt{${c*c}} = ${c}$ cm.`
                    });
                } else if(context === 'real') {
                    q.push({
                        question: `Sebuah tangga bersandar di tembok. Jarak kaki tangga ke tembok $${a}$ m dan tinggi tembok $${b}$ m. Berapa panjang tangga?`,
                        options: [`${c}`, `${c+2}`, `${c-1}`, `${a+b}`], answer: `${c}`,
                        explanation: `Gunakan $c^2 = a^2 + b^2$. $c = \\sqrt{${a}^2 + ${b}^2} = \\sqrt{${a*a} + ${b*b}} = \\sqrt{${c*c}} = ${c}$ m.`
                    });
                } else {
                    if(type === 'c') {
                        q.push({
                            question: `Segitiga siku-siku memiliki alas $${a}$ cm dan tinggi $${b}$ cm. Berapa panjang sisi miringnya?`,
                            options: [`${c}`, `${c+1}`, `${a+b}`, `${c-2}`], answer: `${c}`,
                            explanation: `$c = \\sqrt{${a}^2 + ${b}^2} = \\sqrt{${a*a} + ${b*b}} = ${c}$ cm.`
                        });
                    } else {
                        q.push({
                            question: `Sisi miring segitiga siku-siku adalah $${c}$ cm dan salah satu sisi tegaknya $${a}$ cm. Berapa panjang sisi lainnya?`,
                            options: [`${b}`, `${b+2}`, `${b-1}`, `${c-a}`], answer: `${b}`,
                            explanation: `$b = \\sqrt{c^2 - a^2} = \\sqrt{${c}^2 - ${a}^2} = \\sqrt{${c*c} - ${a*a}} = \\sqrt{${b*b}} = ${b}$ cm.`
                        });
                    }
                }
            }
            return q.map(item => ({...item, options: item.options.sort(() => Math.random() - 0.5)}));
        };

        // 3. Generator Assignment Campuran
        const genMixed = () => {
            let q1 = genPythagoras('c', 4, 'basic');
            let q2 = genPythagoras('a', 3, 'basic');
            let q3 = genPythagoras('c', 3, 'real');
            return [...q1, ...q2, ...q3].sort(() => Math.random() - 0.5);
        };

        // --- DATA LESSON ---
        const lessonData = [
            {
                id: "home", title: "Home", time: "-", type: "home"
            },
            {
                id: "sec1", title: "1. Spiral Review", time: "00:00-00:10", type: "lesson",
                theory: "<b>Pemanasan Otak!</b><br>Mari mengingat kembali pelajaran sebelumnya tentang Bangun Ruang dan Bilangan Kuadrat. <br><br>Ingat: <br> Volume Kubus = $s \\times s \\times s$<br> Volume Balok = $p \\times l \\times t$<br> Kuadrat = bilangan dikali dirinya sendiri ($n^2$).",
                questions: genSpiral()
            },
            {
                id: "sec2", title: "2. Intro & Real-World", time: "00:10-00:15", type: "lesson",
                theory: "<b>Koneksi Dunia Nyata</b><br>Pernah penasaran bagaimana layar TV 50 inci diukur? Mereka mengukur <i>diagonalnya</i> menggunakan rahasia kuno <b>Teorema Pythagoras</b>! Rumus ini hanya berlaku untuk segitiga dengan 'sudut kursi L' (siku-siku 90°).",
                questions: genPythagoras('c', 10, 'real')
            },
            {
                id: "sec3", title: "3. Prior Knowledge", time: "00:15-00:20", type: "lesson",
                theory: "<b>Visualisasi Kuadrat</b><br>$3^2$ artinya $3 \\times 3 = 9$. Secara visual, ini adalah persegi berukuran 3x3 kotak. <br>Akar kuadrat ($\\sqrt{}$) adalah 'jalan pulang' dari bilangan kuadrat. Contoh: $\\sqrt{25} = 5$.",
                questions: genPythagoras('c', 10, 'visual')
            },
            {
                id: "sec4", title: "4. Problem Intro", time: "00:20-00:30", type: "lesson",
                theory: "<b>Rumus Utama Pythagoras</b><br>Jika kita buat persegi di alas ($a$) dan persegi di tinggi ($b$), jumlah kotak keduanya sama dengan persegi di sisi miring ($c$). <br><br><span class='text-blue-600 font-bold'>$a^2 + b^2 = c^2$</span>",
                questions: genPythagoras('c', 10, 'basic')
            },
            {
                id: "sec5", title: "5. Guided Practice", time: "00:30-00:45", type: "lesson",
                theory: "<b>Latihan Terbimbing</b><br>Mari hitung bersama! Tinggi tembok = 6m, jarak tangga = 8m. <br>$6^2 + 8^2 = c^2$ <br>$36 + 64 = 100$ <br>$c = \\sqrt{100} = 10$ meter.",
                questions: genPythagoras('c', 10, 'real')
            },
            {
                id: "sec6", title: "6. Independent", time: "00:45-01:00", type: "lesson",
                theory: "<b>Praktik Mandiri</b><br>Bagaimana jika sisi miring sudah diketahui, dan kita mencari alas/tinggi? Gunakan modifikasi rumus: <br>$a = \\sqrt{c^2 - b^2}$ <br>$b = \\sqrt{c^2 - a^2}$",
                questions: genPythagoras('a', 10, 'basic')
            },
            {
                id: "sec7", title: "7. Assignment", time: "01:00-01:20", type: "assignment",
                groups: [
                    { title: "Grup 1", questions: genMixed() },
                    { title: "Grup 2", questions: genMixed() },
                    { title: "Grup 3", questions: genMixed() },
                    { title: "Grup 4", questions: genMixed() },
                    { title: "Grup 5", questions: genMixed() }
                ]
            },
            {
                id: "sec8", title: "8. Consolidation", time: "01:20-01:25", type: "consolidation"
            }
        ];
        // --- STATE APP ---
        let currentSectionIdx = 0;
        let currentQuestionIdx = 0;
        let assignmentGroupIdx = 0;
        let studentAnswers = []; // untuk melacak jawaban assignment
        
        // --- RENDER NAV ---
        function renderNav() {
            const navContainer = document.getElementById("top-nav");
            navContainer.innerHTML = "";
            lessonData.forEach((sec, idx) => {
                const btn = document.createElement("button");
                btn.className = `px-3 py-1 text-xs rounded border border-green-500 hover:bg-green-600 transition nav-btn ${idx === currentSectionIdx ? 'active' : ''}`;
                btn.innerHTML = `${sec.title} <br><span class='text-[0.6rem]'>${sec.time}</span>`;
                btn.onclick = () => {
                    currentSectionIdx = idx;
                    currentQuestionIdx = 0;
                    assignmentGroupIdx = 0;
                    studentAnswers = [];
                    renderApp();
                };
                navContainer.appendChild(btn);
            });
        }

        // --- RENDER APP ---
        function renderApp() {
            renderNav();
            const container = document.getElementById("app-container");
            container.innerHTML = "";
            const sec = lessonData[currentSectionIdx];

            if (sec.type === "home") {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center fade-in">
                        <i class="fa-solid fa-graduation-cap text-6xl text-green-600 mb-4"></i>
                        <h1 class="text-4xl font-bold text-gray-800">MATH TUTORING</h1>
                        <h2 class="text-2xl text-gray-600 mb-2">by Deni</h2>
                        <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full border-t-4 border-green-500 mt-4">
                            <h3 class="text-xl font-bold mb-2">Topic: Teorema Pythagoras & Visualisasi Kuadrat</h3>
                            <h4 class="text-md text-gray-500 italic mb-4">Topic: Pythagorean Theorem & Square Visualization</h4>
                            <div class="text-left bg-gray-50 p-4 rounded border">
                                <h4 class="font-bold mb-2"><i class="fa-solid fa-clipboard-list text-green-600"></i> Aturan Kelas:</h4>
                                <ol class="list-decimal pl-5 text-sm space-y-1">
                                    <li>Berbicara secara bergantian.</li>
                                    <li>Meminta izin ketika ingin meninggalkan kelas.</li>
                                    <li>Menyalakan kamera dan microphone jika diperlukan.</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                `;
            } 
            else if (sec.type === "lesson") {
                const q = sec.questions[currentQuestionIdx];
                const progress = ((currentQuestionIdx) / sec.questions.length) * 100;
                
                container.innerHTML = `
                    <div class="flex h-full gap-4 fade-in">
                        <!-- Kolom Teori -->
                        <div class="w-1/3 bg-white p-4 rounded-lg shadow-md border-l-4 border-blue-500 flex flex-col">
                            <h2 class="text-xl font-bold mb-2 text-blue-700"><i class="fa-solid fa-book-open"></i> Teori</h2>
                            <div class="text-sm text-gray-700 flex-grow">${sec.theory}</div>
                        </div>
                        
                        <!-- Kolom Exercise -->
                        <div class="w-2/3 bg-white p-4 rounded-lg shadow-md flex flex-col">
                            <div class="flex justify-between items-center mb-2">
                                <h2 class="text-xl font-bold text-green-700"><i class="fa-solid fa-pencil"></i> Exercise (${currentQuestionIdx + 1}/${sec.questions.length})</h2>
                                <button onclick="resetQuestion()" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                            </div>
                            
                            <!-- Progress Bar -->
                            <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                                <div class="bg-green-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                            </div>

                            <div class="flex-grow flex flex-col justify-center">
                                <p class="text-lg mb-4">${q.question}</p>
                                <div class="grid grid-cols-2 gap-2" id="options-container">
                                    ${q.options.map(opt => `
                                        <button class="opt-btn p-3 bg-gray-100 hover:bg-green-100 border rounded text-center font-bold transition" onclick="checkAnswer(this, '${opt}', '${q.answer}')">${opt}</button>
                                    `).join('')}
                                </div>
                                
                                <div id="explanation-box" class="collapse-content mt-4 p-3 bg-blue-50 border border-blue-200 rounded text-sm text-blue-800">
                                    <strong>Penjelasan:</strong><br>${q.explanation}
                                </div>
                            </div>

                            <div class="flex justify-between mt-4">
                                <button onclick="prevQuestion()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 ${currentQuestionIdx === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentQuestionIdx === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-left"></i> Prev</button>
                                <button onclick="nextQuestion()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"><i class="fa-solid fa-arrow-right"></i> Next</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (sec.type === "assignment") {
                const group = sec.groups[assignmentGroupIdx];
                const q = group.questions[currentQuestionIdx];
                const progress = ((currentQuestionIdx) / group.questions.length) * 100;

                container.innerHTML = `
                    <div class="w-full h-full bg-white p-6 rounded-lg shadow-md flex flex-col fade-in border-t-4 border-purple-500">
                        <div class="text-center mb-2">
                            <h2 class="text-2xl font-bold text-purple-700"><i class="fa-solid fa-file-signature"></i> ASSIGNMENT - ${group.title}</h2>
                            <p class="text-sm text-gray-500">Kerjakan soal berikut untuk mendapatkan skor.</p>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="w-full bg-gray-200 rounded-full h-2 mb-6">
                            <div class="bg-purple-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <div class="flex-grow flex flex-col items-center justify-center max-w-2xl mx-auto w-full">
                            <p class="text-xl mb-6 text-center w-full">${currentQuestionIdx + 1}. ${q.question}</p>
                            <div class="grid grid-cols-2 gap-4 w-full">
                                ${q.options.map(opt => `
                                    <button class="p-4 bg-gray-50 hover:bg-purple-100 border rounded text-lg font-bold transition" onclick="recordAssignmentAnswer('${opt}')">${opt}</button>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="flex justify-between mt-4">
                            <div class="text-sm text-gray-400">Soal ${currentQuestionIdx + 1} dari ${group.questions.length}</div>
                        </div>
                    </div>
                `;
            }
            else if (sec.type === "consolidation") {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center fade-in bg-white rounded-lg shadow-lg p-8 border-t-4 border-yellow-500">
                        <i class="fa-solid fa-trophy text-6xl text-yellow-500 mb-4"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">Luar Biasa, Jean!</h2>
                        <p class="text-lg text-gray-600 mb-6">Hari ini kamu telah belajar bahwa $c^2 = a^2 + b^2$. Ini adalah kunci untuk banyak hal di dunia nyata.</p>
                        <a href="https://learn.algonova.id/login" target="_blank" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg shadow hover:bg-blue-700 transition flex items-center gap-2">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk ke AlgoNova
                        </a>
                    </div>
                `;
            }

            // Render math pada konten yang baru ditambahkan
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }

        // --- EXERCISE LOGIC ---
        function checkAnswer(btn, selected, correct) {
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => {
                b.disabled = true;
                if(b.innerText === correct) {
                    b.classList.remove('bg-gray-100');
                    b.classList.add('bg-green-500', 'text-white');
                }
            });
            if(selected !== correct) {
                btn.classList.remove('bg-gray-100');
                btn.classList.add('bg-red-500', 'text-white');
            }
            document.getElementById('explanation-box').classList.add('show');
        }

        function resetQuestion() {
            renderApp(); // Re-render reset state
        }

        function nextQuestion() {
            const sec = lessonData[currentSectionIdx];
            if(currentQuestionIdx < sec.questions.length - 1) {
                currentQuestionIdx++;
                renderApp();
            } else {
                alert("Ini adalah soal terakhir di section ini.");
            }
        }

        function prevQuestion() {
            if(currentQuestionIdx > 0) {
                currentQuestionIdx--;
                renderApp();
            }
        }

        // --- ASSIGNMENT LOGIC ---
        function recordAssignmentAnswer(selected) {
            const group = lessonData[currentSectionIdx].groups[assignmentGroupIdx];
            const q = group.questions[currentQuestionIdx];
            const isCorrect = (selected === q.answer);
            
            studentAnswers.push({
                question: q.question,
                selected: selected,
                correct: q.answer,
                isCorrect: isCorrect
            });

            if (currentQuestionIdx < group.questions.length - 1) {
                currentQuestionIdx++;
                renderApp();
            } else {
                showAssignmentResult(group);
            }
        }

        function showAssignmentResult(group) {
            const correctCount = studentAnswers.filter(a => a.isCorrect).length;
            const container = document.getElementById("app-container");
            
            let htmlStr = `
                <div class="w-full h-full bg-white p-6 rounded-lg shadow-md flex flex-col fade-in border-t-4 border-purple-500 relative">
                    <h2 class="text-2xl font-bold text-center mb-4 text-purple-700">Skor: ${correctCount} / ${group.questions.length}</h2>
                    <div class="overflow-y-auto flex-grow pr-2 text-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100">
                                    <th class="border p-2">No</th>
                                    <th class="border p-2 w-1/2">Pertanyaan</th>
                                    <th class="border p-2">Jawaban Siswa</th>
                                    <th class="border p-2">Kunci</th>
                                    <th class="border p-2">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${studentAnswers.map((ans, idx) => `
                                    <tr>
                                        <td class="border p-2 text-center">${idx + 1}</td>
                                        <td class="border p-2">${ans.question}</td>
                                        <td class="border p-2 text-center">${ans.selected}</td>
                                        <td class="border p-2 text-center">${ans.correct}</td>
                                        <td class="border p-2 text-center ${ans.isCorrect ? 'text-green-600' : 'text-red-600'} font-bold">
                                            ${ans.isCorrect ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-xmark"></i>'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="flex justify-between mt-4 bg-white pt-2 border-t">
                        <button onclick="printResult('${group.title}', ${correctCount}, ${group.questions.length})" class="px-4 py-2 bg-blue-500 text-white font-bold rounded shadow hover:bg-blue-600"><i class="fa-solid fa-print"></i> Cetak Hasil</button>
                        ${assignmentGroupIdx < lessonData[currentSectionIdx].groups.length - 1 
                            ? `<button onclick="nextAssignmentGroup()" class="px-4 py-2 bg-purple-600 text-white font-bold rounded shadow hover:bg-purple-700">Lanjut Grup ${assignmentGroupIdx + 2} <i class="fa-solid fa-arrow-right"></i></button>` 
                            : `<p class="text-green-600 font-bold p-2">Semua Assignment Selesai!</p>`}
                    </div>
                </div>
            `;
            container.innerHTML = htmlStr;
            renderMathInElement(container, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] });
        }

        function nextAssignmentGroup() {
            assignmentGroupIdx++;
            currentQuestionIdx = 0;
            studentAnswers = [];
            renderApp();
        }

        // --- PRINT LOGIC ---
        function printResult(groupTitle, score, total) {
            const dateStr = new Date().toLocaleDateString('id-ID');
            let printWindow = window.open('', '_blank');
            
            let tableHTML = studentAnswers.map((ans, idx) => `
                <tr>
                    <td style="border: 1px solid #000; padding: 5px; text-align: center;">${idx + 1}</td>
                    <td style="border: 1px solid #000; padding: 5px;">${ans.question}</td>

                    <td style="border: 1px solid #000; padding: 5px; text-align: center;">${ans.correct}</td>
                    <td style="border: 1px solid #000; padding: 5px; text-align: center;">${ans.isCorrect ? 'v' : 'x'}</td>
                </tr>
            `).join('');

            let htmlDoc = `
